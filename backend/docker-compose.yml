version: '3.8'

services:
  medicore-api:
    build: .
    container_name: medicore-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - medicore-network

networks:
  medicore-network:
    driver: bridge
